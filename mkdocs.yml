site_name: The Unbound Campaign Notes
site_description: D&D campaign notes for The Unbound

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

exclude_docs: |
  *.pdf
  requirements.txt
  Session Notes/TEMPLATE.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Reference:
    - World & Campaign Notes: Reference Notes/The Unbound Notes.md
    - Tomis: Reference Notes/Tomis Description.md
    - Freya: Reference Notes/Freya Description.md
    - Grimbold: Reference Notes/Grimbold Description.md
    - Uriel: Reference Notes/Uriel Description.md
    - Rowan Karst: Reference Notes/Rowan Description.md
    - Juniper: Reference Notes/Juniper Description.md
    - The Deliverance Funeral Celebration: Reference Notes/The Deliverance Funeral Celebration.md
    - Turst Fields One-Shot: Reference Notes/Turst Fields 1shot Notes.md
